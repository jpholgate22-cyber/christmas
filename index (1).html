<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Merry Christmas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Noto Serif supports both Latin and Greek, so the Greek text renders properly -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --night-1: #0b1d3a;
    --night-2: #16335f;
    --night-3: #2b5a8c;
    --ice: #e8f4ff;
    --gold: #f3c969;
    --paper: #fbf3e0;
    --paper-edge: #e6d3a8;
    --ink: #3b2a1a;
    --red: #b8323a;
    --red-dark: #8c2229;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Noto Serif", Georgia, serif;
    color: var(--ice);
    background: linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 55%, var(--night-3) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    overflow-x: hidden;
  }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  main { position: relative; z-index: 2; }
  section { min-height: 100vh; padding: 64px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

  /* Language toggle */
  #lang {
    position: fixed; top: 14px; right: 14px; z-index: 10;
    background: rgba(255,255,255,.12); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.3); color: var(--ice);
    padding: 8px 14px; border-radius: 999px; font: inherit; font-size: .85rem; cursor: pointer;
  }
  #lang:hover { background: rgba(255,255,255,.22); }

  /* Hero */
  h1 { font-size: clamp(2.2rem, 9vw, 4.5rem); line-height: 1.15; text-shadow: 0 0 24px rgba(180,220,255,.55); }
  .sub { margin-top: 14px; font-size: clamp(1rem, 4vw, 1.4rem); opacity: .9; font-style: italic; }
  .hint { margin-top: 38px; font-size: .9rem; opacity: .7; animation: bob 2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(8px); } }

  /* Video */
  .video-wrap { width: min(92vw, 760px); aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.25); background: rgba(0,0,0,.35); }
  .video-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
  .video-placeholder { height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: .8; }
  h2 { font-size: clamp(1.4rem, 5vw, 2rem); margin-bottom: 22px; }

  /* Envelope */
  .env-scene { perspective: 1000px; }
  .envelope { position: relative; width: min(84vw, 340px); height: min(56vw, 226px); cursor: pointer; margin: 30px auto 0; border: 0; background: none; transition: transform .6s ease, opacity .6s ease; }
  .envelope:focus-visible { outline: 3px solid var(--gold); outline-offset: 8px; border-radius: 8px; }
  .env-back { position: absolute; inset: 0; background: var(--red-dark); border-radius: 6px; box-shadow: 0 14px 34px rgba(0,0,0,.45); }
  .env-letter { position: absolute; left: 7%; right: 7%; top: 8%; height: 82%; background: var(--paper); border-radius: 4px; transition: transform .9s ease .45s; z-index: 1; }
  .env-front { position: absolute; inset: 0; z-index: 2; border-radius: 6px; overflow: hidden; pointer-events: none; }
  .env-front::before, .env-front::after { content: ""; position: absolute; bottom: 0; width: 0; height: 0; border-style: solid; }
  .env-front::before { left: 0; border-width: calc(min(56vw,226px)/2) calc(min(84vw,340px)/2) 0 0; border-width: 0 0 0 0; }
  .env-front svg { width: 100%; height: 100%; display: block; }
  .flap { position: absolute; left: 0; top: 0; width: 100%; height: 55%; z-index: 3; transform-origin: top; transition: transform .6s ease, z-index 0s .3s; }
  .flap svg { width: 100%; height: 100%; display: block; }
  .seal { position: absolute; left: 50%; top: 48%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #e24b55, var(--red)); box-shadow: 0 3px 8px rgba(0,0,0,.4); z-index: 4; display: grid; place-items: center; font-size: 1.3rem; transition: opacity .3s; }
  .envelope.open .flap { transform: rotateX(180deg); z-index: 0; }
  .envelope.open .seal { opacity: 0; }
  .envelope.open .env-letter { transform: translateY(-70%); }
  .envelope.gone { transform: scale(.7); opacity: 0; pointer-events: none; height: 0; margin: 0; }
  .tap { margin-top: 26px; font-size: .95rem; opacity: .85; }

  /* Scroll (letter) */
  #scroll-area { width: min(92vw, 640px); display: none; }
  .rod { height: 22px; border-radius: 12px; background: linear-gradient(180deg, #a8743a, #6e4521 60%, #8a5a2c); box-shadow: 0 4px 10px rgba(0,0,0,.4); position: relative; z-index: 2; }
  .rod::before, .rod::after { content: ""; position: absolute; top: -3px; width: 14px; height: 28px; border-radius: 7px; background: #5a3818; }
  .rod::before { left: -6px; } .rod::after { right: -6px; }
  .parchment {
    background: linear-gradient(180deg, var(--paper), #f5e8c8);
    color: var(--ink); text-align: left;
    margin: -4px 14px; overflow: hidden; height: 0;
    transition: height 1.6s cubic-bezier(.22,.8,.3,1);
    box-shadow: inset 0 0 40px rgba(150,110,50,.25), 0 10px 30px rgba(0,0,0,.35);
    border-left: 2px solid var(--paper-edge); border-right: 2px solid var(--paper-edge);
  }
  .letter { padding: 34px clamp(20px, 6vw, 44px); font-size: clamp(1rem, 3.8vw, 1.15rem); line-height: 1.8; font-style: italic; }
  .letter p { margin-bottom: 1.1em; }
  .letter .to { font-weight: 700; font-style: normal; }
  .letter .sig { text-align: right; margin-top: 1.4em; margin-bottom: 0; }
  .btn { display: inline-block; margin-top: 26px; padding: 14px 30px; border: 0; border-radius: 999px; font: inherit; font-weight: 700; font-size: 1.05rem; cursor: pointer; background: linear-gradient(180deg, #f8d98a, var(--gold)); color: #3a2a06; box-shadow: 0 6px 18px rgba(243,201,105,.35); transition: transform .2s; }
  .btn:hover { transform: translateY(-2px) scale(1.03); }
  #to-present { opacity: 0; transition: opacity 1s ease; }
  #to-present.show { opacity: 1; }

  /* Present */
  #present { display: none; }
  .gift-card { width: min(92vw, 520px); padding: 34px 26px; border-radius: 20px; background: rgba(255,255,255,.1); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.3); box-shadow: 0 14px 40px rgba(0,0,0,.4); }
  .gift-emoji { font-size: 3.2rem; margin-bottom: 8px; animation: bob 2.2s ease-in-out infinite; }
  .gift-card p { line-height: 1.7; margin-bottom: 14px; }
  .code { display: inline-block; font-family: ui-monospace, Menlo, monospace; font-size: 1.15rem; letter-spacing: .08em; background: rgba(0,0,0,.35); padding: 10px 16px; border-radius: 10px; border: 1px dashed var(--gold); margin: 4px 0 12px; user-select: all; }
  .gift-link { color: var(--gold); }
  .xmas-end { margin-top: 28px; font-size: 1.2rem; font-style: italic; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { animation: none !important; transition-duration: .01s !important; }
  }
</style>
</head>
<body>

<canvas id="snow" aria-hidden="true"></canvas>
<button id="lang" type="button">Ελληνικά</button>

<main>
  <!-- 1. Hero -->
  <section id="hero">
    <h1 data-i18n="hero"></h1>
    <p class="sub" data-i18n="heroSub"></p>
    <p class="hint" data-i18n="scrollHint"></p>
  </section>

  <!-- 2. Video -->
  <section id="video">
    <h2 data-i18n="videoTitle"></h2>
    <div class="video-wrap" id="videoWrap"></div>
  </section>

  <!-- 3. Envelope + scroll -->
  <section id="letter-section">
    <h2 data-i18n="envTitle" id="envTitle"></h2>

    <div class="env-scene" id="envScene">
      <button class="envelope" id="envelope" type="button" aria-label="Open the envelope">
        <div class="env-back"></div>
        <div class="env-letter"></div>
        <div class="env-front">
          <svg viewBox="0 0 100 66" preserveAspectRatio="none">
            <polygon points="0,0 0,66 56,38" fill="#a22a31"/>
            <polygon points="100,0 100,66 44,38" fill="#a22a31"/>
            <polygon points="0,66 50,30 100,66" fill="#b8323a"/>
          </svg>
        </div>
        <div class="flap">
          <svg viewBox="0 0 100 36" preserveAspectRatio="none">
            <polygon points="0,0 100,0 50,36" fill="#c93b44"/>
          </svg>
        </div>
        <div class="seal">❄</div>
      </button>
      <p class="tap" id="tapHint" data-i18n="tap"></p>
    </div>

    <div id="scroll-area">
      <div class="rod"></div>
      <div class="parchment" id="parchment">
        <div class="letter" id="letterBody"></div>
      </div>
      <div class="rod"></div>
      <button class="btn" id="to-present" type="button" data-i18n="presentBtn"></button>
    </div>
  </section>

  <!-- 4. Present -->
  <section id="present">
    <div class="gift-card">
      <div class="gift-emoji">🎁</div>
      <h2 data-i18n="giftTitle"></h2>
      <p id="giftText"></p>
      <div id="giftCodeWrap"></div>
      <div id="giftLinkWrap"></div>
      <p class="xmas-end" data-i18n="end"></p>
    </div>
  </section>
</main>

<script>
/* ============================================================
   EDIT THIS SECTION: everything personal lives here
   ============================================================ */
const CONFIG = {
  // YouTube video ID (the bit after v= in the URL). Upload as "Unlisted".
  videoId: "YOUR_VIDEO_ID",

  // Voucher details (leave a value as "" to hide it)
  giftCode: "XXXX-XXXX-XXXX",
  giftLink: "https://example.com/redeem",

  text: {
    en: {
      hero: "Merry Christmas, Μάτια μου ❄",
      heroSub: "I made you something. Scroll down.",
      scrollHint: "↓ keep going ↓",
      videoTitle: "First, a little message",
      envTitle: "Something for you",
      tap: "Tap the envelope to open it",
      to: "My dearest,",
      letter: [
        "PLACEHOLDER: replace this with your letter.",
        "Write a few paragraphs here. Separate each paragraph with a comma and quotes, like these lines.",
        "Something sweet, something funny, something about her painting."
      ],
      sig: "With all my love,\nJames",
      presentBtn: "Go to your present 🎁",
      giftTitle: "Your present",
      giftText: "PLACEHOLDER: describe the gift here. For example: a voucher to spend on art supplies, for whenever you run low.",
      codeLabel: "Your code:",
      linkLabel: "Redeem it here",
      end: "Merry Christmas. I love you. ❄",
      toggle: "Ελληνικά",
      noVideo: "Video coming soon ❄"
    },
    el: {
      hero: "Καλά Χριστούγεννα, Μάτια μου ❄",
      heroSub: "Έφτιαξα κάτι για σένα. Κατέβα πιο κάτω.",
      scrollHint: "↓ συνέχισε ↓",
      videoTitle: "Πρώτα, ένα μικρό μήνυμα",
      envTitle: "Κάτι για σένα",
      tap: "Πάτα τον φάκελο για να τον ανοίξεις",
      to: "Αγάπη μου,",
      letter: [
        "ΤΡΟΠΟΠΟΙΗΣΕ ΑΥΤΟ: γράψε εδώ το γράμμα σου στα ελληνικά.",
        "Κάθε παράγραφος μπαίνει σε εισαγωγικά, χωρισμένη με κόμμα.",
        "Κάτι γλυκό, κάτι αστείο, κάτι για τη ζωγραφική της."
      ],
      sig: "Με όλη μου την αγάπη,\nJames",
      presentBtn: "Πήγαινε στο δώρο σου 🎁",
      giftTitle: "Το δώρο σου",
      giftText: "ΤΡΟΠΟΠΟΙΗΣΕ ΑΥΤΟ: περίγραψε εδώ το δώρο.",
      codeLabel: "Ο κωδικός σου:",
      linkLabel: "Εξαργύρωσέ το εδώ",
      end: "Καλά Χριστούγεννα. Σ' αγαπώ. ❄",
      toggle: "English",
      noVideo: "Το βίντεο έρχεται σύντομα ❄"
    }
  }
};
/* ============================================================ */

let lang = "en";
const T = () => CONFIG.text[lang];
const $ = id => document.getElementById(id);

/* ---------- Language ---------- */
function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T()[el.dataset.i18n]; });
  $("lang").textContent = T().toggle;
  $("giftText").textContent = T().giftText;

  // Letter
  const body = $("letterBody");
  body.innerHTML = "";
  const to = document.createElement("p"); to.className = "to"; to.textContent = T().to; body.appendChild(to);
  T().letter.forEach(t => { const p = document.createElement("p"); p.textContent = t; body.appendChild(p); });
  const sig = document.createElement("p"); sig.className = "sig"; sig.style.whiteSpace = "pre-line"; sig.textContent = T().sig; body.appendChild(sig);
  if (letterOpen) $("parchment").style.height = body.scrollHeight + "px";

  // Video placeholder text
  const ph = document.querySelector(".video-placeholder");
  if (ph) ph.textContent = T().noVideo;

  // Gift code + link
  const cw = $("giftCodeWrap"); cw.innerHTML = "";
  if (CONFIG.giftCode) {
    const l = document.createElement("p"); l.textContent = T().codeLabel;
    const c = document.createElement("div"); c.className = "code"; c.textContent = CONFIG.giftCode;
    cw.append(l, c);
  }
  const lw = $("giftLinkWrap"); lw.innerHTML = "";
  if (CONFIG.giftLink) {
    const a = document.createElement("a"); a.className = "gift-link"; a.href = CONFIG.giftLink;
    a.target = "_blank"; a.rel = "noopener"; a.textContent = T().linkLabel + " →";
    lw.appendChild(a);
  }
}
$("lang").addEventListener("click", () => { lang = lang === "en" ? "el" : "en"; render(); });

/* ---------- Video ---------- */
(function () {
  const wrap = $("videoWrap");
  if (CONFIG.videoId && CONFIG.videoId !== "YOUR_VIDEO_ID") {
    const f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(CONFIG.videoId) + "?rel=0";
    f.title = "Video message";
    f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
    f.allowFullscreen = true;
    wrap.appendChild(f);
  } else {
    const d = document.createElement("div"); d.className = "video-placeholder"; wrap.appendChild(d);
  }
})();

/* ---------- Envelope -> scroll ---------- */
let letterOpen = false;
$("envelope").addEventListener("click", function () {
  if (letterOpen) return;
  letterOpen = true;
  const env = this;
  env.classList.add("open");
  $("tapHint").style.opacity = 0;

  setTimeout(() => {
    env.classList.add("gone");
    $("envTitle").style.display = "none";
    $("tapHint").style.display = "none";
    const area = $("scroll-area");
    area.style.display = "block";
    const p = $("parchment");
    // force reflow so the height transition runs
    void p.offsetHeight;
    p.style.height = $("letterBody").scrollHeight + "px";
    area.scrollIntoView({ behavior: "smooth", block: "start" });
    setTimeout(() => $("to-present").classList.add("show"), 1500);
  }, 1500);
});
window.addEventListener("resize", () => { if (letterOpen) $("parchment").style.height = $("letterBody").scrollHeight + "px"; });

/* ---------- Present ---------- */
$("to-present").addEventListener("click", () => {
  const s = $("present");
  s.style.display = "flex";
  setTimeout(() => s.scrollIntoView({ behavior: "smooth", block: "start" }), 50);
});

/* ---------- Snow ---------- */
(function () {
  const cv = $("snow"), ctx = cv.getContext("2d");
  let w, h, flakes = [], running = true;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function size() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(140, Math.max(50, w / 9)));
    flakes = Array.from({ length: n }, () => makeFlake(true));
  }
  function makeFlake(anywhere) {
    return {
      x: Math.random() * w,
      y: anywhere ? Math.random() * h : -10,
      r: Math.random() * 2.8 + 0.8,
      vy: Math.random() * 0.9 + 0.4,
      drift: Math.random() * 1.2 - 0.6,
      phase: Math.random() * Math.PI * 2,
      o: Math.random() * 0.5 + 0.4
    };
  }
  function tick(t) {
    if (!running) return;
    ctx.clearRect(0, 0, w, h);
    for (const f of flakes) {
      f.y += f.vy;
      f.x += Math.sin(t / 1200 + f.phase) * 0.4 + f.drift * 0.2;
      if (f.y > h + 10 || f.x < -20 || f.x > w + 20) Object.assign(f, makeFlake(false));
      ctx.beginPath();
      ctx.fillStyle = "rgba(255,255,255," + f.o + ")";
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  size();
  window.addEventListener("resize", size);
  document.addEventListener("visibilitychange", () => {
    running = !document.hidden;
    if (running) requestAnimationFrame(tick);
  });
  if (reduce) {
    flakes.forEach(f => { ctx.fillStyle = "rgba(255,255,255," + f.o + ")"; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill(); });
  } else {
    requestAnimationFrame(tick);
  }
})();

render();
</script>
</body>
</html>
